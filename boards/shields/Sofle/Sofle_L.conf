# ZMK Studio settings
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# RGB settings
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60
# Turn off RGB when the keyboard enters idle state
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# OLED settings
# Base ZMK OLED support.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Central OLED marker: WPM widget disabled.
CONFIG_NICE_OLED_WIDGET_WPM=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_RESPONSIVE_BONGO_CAT=n

# Modifiers indicators: Windows style (Win/Alt) instead of default macOS (Cmd/Opt).
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_WINDOWS=y

# Square background behind connection/battery icons (nice!view-style look).
CONFIG_NICE_OLED_WIDGET_OUTPUT_BACKGROUND=y

# Bigger profile/connection icons (5 slots side by side) instead of small dots.
CONFIG_NICE_OLED_WIDGET_PROFILE_BIG=y

# Sleep art: show an image instead of blanking when idle/asleep.
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=y
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_SLEEP=y

# Low-latency link to the right half. Default PREF_LATENCY=30 lets the right
# half skip up to 30 connection events (~230ms worst case) before a keypress
# reaches the left half. Costs some right-half battery life.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400
