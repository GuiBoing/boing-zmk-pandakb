# ZMK Studio settings
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# RGB settings
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60
# Turn off RGB when the keyboard enters idle state
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# OLED: custom status screen (custom_status_screen.c) built from ZMK's
# native widgets + a battery widget that shows both halves.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y

# Fetch the right half's battery level (shown on the OLED). Proxy to the host
# disabled: the extra battery service caused stuck keys on BT profile 2.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n

# Low-latency link to the right half. Default PREF_LATENCY=30 lets the right
# half skip up to 30 connection events (~230ms worst case) before a keypress
# reaches the left half. Costs some right-half battery life.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400

# Deep sleep disabled on the central: after the 15 min deep sleep it never
# woke up again (OLED dark, no typing) until power-cycled. It still goes idle
# after CONFIG_ZMK_IDLE_TIMEOUT (OLED off, RGB off), only the full power-off
# is skipped. Costs battery while the keyboard sits unused.
CONFIG_ZMK_SLEEP=n
