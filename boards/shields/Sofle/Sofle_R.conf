# RGB settings
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60
# Turn off RGB when the keyboard enters idle state
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# OLED settings
# Base ZMK OLED support.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# https://github.com/mctechnology17/zmk-nice-oled
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=n

# Smart battery crystal replaces the character animation entirely. Note: it
# only animates while charging over USB; since the peripheral has no USB,
# it will show as a static crystal icon in practice.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=y

# Sleep art: show an image instead of blanking when idle/asleep.
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=y
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_SLEEP=y

# Optimize: peripheral has less power/CPU budget than central, slow the
# animation frame rate to cut CPU wake-ups (docs/OPTIMIZE.md split-keyboard tip).
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=1500

# Square background behind connection/battery icons (nice!view-style look).
CONFIG_NICE_OLED_WIDGET_OUTPUT_BACKGROUND=y
