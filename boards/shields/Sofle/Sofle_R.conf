# RGB settings
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60
# Turn off RGB when the keyboard enters idle state
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# OLED settings
# Base ZMK OLED support.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# https://github.com/mctechnology17/zmk-nice-oled
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=y #bool	n	Enable smart battery animation on peripheral
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_WPM=y #bool	n	Enable PERIPHERAL WPM widget compatibility
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y #bool	y	Enable animation on peripheral
# CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=n #bool	y (if no anim)	Enable static image on peripheral
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y #bool	n	Enable gem animation on peripheral
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n #bool	y	Enable cat animation on peripheral
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=n #bool	n	Enable head animation on peripheral
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=n #bool	n	Enable pokemon animation on peripheral
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=n #bool	n	Enable spaceman animation on peripheral
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=150
# CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIM=n #bool	n	Enable static vim on peripheral
# CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIP_MARCOS=n #bool	n	Enable static vim_marcos on peripheral
# CONFIG_NICE_OLED_WIDGET_PERIPHERAL=n #bool	n	Enable test widget on peripheral
