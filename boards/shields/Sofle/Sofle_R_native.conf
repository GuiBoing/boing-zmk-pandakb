# RGB settings
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60
# Turn off RGB when the keyboard enters idle state
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# OLED settings: built-in ZMK status screen widgets, no external display module.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y

# DIAGNOSTIC: all widgets off (screen should just render blank/blank-ish with
# no noise). If it's still noisy with everything off, the bug isn't in a
# specific widget at all.
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
