# RGB settings
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60
# Turn off RGB when the keyboard enters idle state
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# OLED: custom screen (peripheral_status_screen.c): battery/link bar on top +
# Hammerbeam art slideshow below.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y

# Seconds between art images (in ms).
CONFIG_SOFLE_ART_INTERVAL_MS=10000
# Flip art colors if it looks inverted on the panel.
# CONFIG_SOFLE_ART_INVERTED=y
