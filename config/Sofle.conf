# Battery level report interval in seconds
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Increase keyboard debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# BLE transmit power. +8 dBm (max) costs a lot of battery on every radio event and
# with the 7.5ms interval below the radio fires constantly. +4 dBm keeps the link
# solid at desk distance; it does not change latency.
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y
# Change the default keyboard display name
CONFIG_ZMK_KEYBOARD_NAME="Boing Sofle"
# Workaround for battery report issues on Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

# OLED-related settings
# Left (central) uses the custom screen from boards/shields/Sofle/custom_status_screen.c
# (selected in Kconfig.defconfig); right (peripheral) uses ZMK's built-in screen.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Small font (layer name): Montserrat 12. UNSCII 8 has no LVGL symbol glyphs,
# so the keyboard icon before the layer name rendered as a square.
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_12=y

# Redraw less often to save battery (default 10ms = 100 wake-ups/sec).
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=30

# External modules / optional integrations (kept commented)
# - Nice View
# - dongle display helpers
# - other community display add-ons
# These are not part of the base ZMK setup and are intentionally disabled here.
# CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
# CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
# CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y

# Sleep-related settings
# Milliseconds of inactivity before entering idle state (1 minute).
# Idle blanks the OLEDs and turns RGB off, the biggest battery consumers.
CONFIG_ZMK_IDLE_TIMEOUT=60000
# Deep sleep is configured per half (config/Sofle.conf is applied after the
# shield .conf files, so it can't be set here and overridden per half):
# - right: enabled in Sofle_R_native.conf
# - left: disabled in Sofle_L_native.conf (it would not wake up from it)

# ZMK Studio settings
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# RGB settings
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# Turn off RGB when the keyboard enters idle state
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60

# Rotary encoder settings
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Low-latency BLE connection to the host (default lets the OS poll as slow as
# ~15ms*31 due to PREF_LATENCY=30; gaming needs a tight, fixed interval).
# Costs some battery life since the radio can no longer skip connection events.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

